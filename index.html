<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tile Selection Sheet Maker</title>
<style id="pg"></style>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f2f2;--card:#fff;--tx:#111;--mu:#666;--bd:#d4d4d4;--ac:#000;--act:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--card:#1a1a1a;--tx:#f2f2f2;--mu:#9a9a9a;--bd:#383838;--ac:#fff;--act:#000}}
:root[data-theme="dark"]{--bg:#0d0d0d;--card:#1a1a1a;--tx:#f2f2f2;--mu:#9a9a9a;--bd:#383838;--ac:#fff;--act:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px;max-width:900px}
h1{font-size:20px;margin:6px 0 2px}p.s{color:var(--mu);margin:0 0 10px;font-size:13px}
.tabs{display:flex;gap:6px;margin:8px 0 12px}.tabs button{flex:1}.tabs button.on{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:11px;color:var(--mu);margin:0 0 2px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{resize:vertical}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
.x{padding:5px 10px;color:var(--mu)}
.sec{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.sh{display:flex;gap:8px;align-items:center;margin-bottom:8px}.sh b{min-width:20px}
.it{background:var(--bg);border-radius:8px;padding:8px;margin-bottom:8px}
.it .g{grid-template-columns:1fr 1fr 1fr}.it .w{grid-column:span 3}.it .h{grid-column:span 2}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.fin{font-size:12px;color:var(--tx);margin-top:6px;font-weight:600}
.wrap{overflow-x:auto;border-radius:10px}
#sheet{background:#fff;color:#111;min-width:560px;padding:18px;border:1px solid #cfcfcf;border-radius:10px;font-size:12.5px}
#sheet .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:12px}
#sheet .brand{font-size:19px;font-weight:700;color:#000}#sheet .ttl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#555}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
.ib{border:1px solid #cfcfcf;border-radius:8px;padding:8px 10px;background:#f7f7f7}
.ib h4{margin:0 0 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#000}
.ib div{margin:1px 0}.ib span{color:#777}
table{width:100%;border-collapse:collapse}
th{background:#000;color:#fff;text-align:left;padding:7px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
td{border:1px solid #cfcfcf;padding:6px 8px;vertical-align:top}
tr{break-inside:avoid}
tr.area td{background:#e6e6e6;color:#000;font-weight:700;font-size:13px}
tr.tot td{background:#eee;font-weight:700}
.r{text-align:right;white-space:nowrap}.nw{white-space:nowrap}.cut{text-decoration:line-through;color:#888}
#sheet a{color:#000;font-weight:600;text-decoration:underline}
.nt{margin-top:14px;font-size:11px;color:#555;line-height:1.5;border-top:1px solid #cfcfcf;padding-top:8px}
.nt p{margin:0 0 6px}.nt b{color:#111}
#sheet a.bt{display:inline-block;background:#000;color:#fff;text-decoration:none;font-size:11px;font-weight:600;padding:6px 14px;border-radius:6px;margin:0 8px 0 0}
#sheet.big{font-size:14.5px}
#sheet.big .brand{font-size:30px}#sheet.big .ttl{font-size:15px}
#sheet.big .lg{height:84px!important}#sheet.big .ad{font-size:13px!important;max-width:460px!important}#sheet.big .dd{font-size:15px!important}
#sheet.big .ib h4{font-size:12px}#sheet.big th{font-size:11.5px;padding:9px 7px}#sheet.big td{padding:8px 7px}
#sheet.big tr.area td{font-size:15.5px}#sheet.big .nt{font-size:13px}#sheet.big a.bt{font-size:14px;padding:9px 20px}
.empty{color:#888;text-align:center;padding:30px 0}
@media print{@page{margin:10mm}body{background:#fff;padding:0;max-width:none}.noprint{display:none!important}#pv{display:block!important}.wrap{overflow:visible}#sheet{border:0;padding:0;min-width:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}.mb.on{display:flex}
.md{background:var(--card);color:var(--tx);border-radius:12px;padding:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.md h2{font-size:13px;margin:0 0 8px}.md img{width:100%;border:1px solid var(--bd);border-radius:8px}.md textarea{height:50vh;font-size:13px;font-family:ui-monospace,Menlo,monospace}
@media print{.mb{display:none!important}}
.gt{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:12px;z-index:100}@media print{.gt{display:none!important}}
</style></head><body>

<div id="ub" class="row" style="margin:0 0 4px;align-items:center;justify-content:space-between"><span style="color:var(--mu);font-size:12px"><span id="who"></span> <span id="cs"></span></span><span class="row" style="margin:0"><button id="bm">Saved sheets</button><button id="bt" style="display:none">Team</button><button id="bo">Sign out</button></span></div>
